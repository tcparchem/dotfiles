"$schema" = "https://starship.rs/config-schema.json"

# Based on https://corti.com/why-i-switched-from-oh-my-posh-to-starship-and-what-my-config-looks-like/
add_newline = false

# PowerShell does not support right_format. The fill module preserves the
# article's left/right layout and puts the input prompt on the next line.
format = "$username[ on ](muted)$directory$git_branch$git_status$line_break$character"
palette = "vibrant_black"
command_timeout = 1000

[fill]
symbol = " "

[username]
show_always = true
format = '[ $user]($style)'
style_user = 'bold cyan'
style_root = 'bold red'
[character]
vicmd_symbol = '[#](bold red) '
success_symbol = '[#](bold red) '
error_symbol = '[#](bold red) '

[status]
disabled = false
format = '[✘ $status]($style) '

[cmd_duration]
min_time = 2000
format = '[$duration](yellow) '

[sudo]
disabled = false

[jobs]
symbol = '✦ '

[shlvl]
disabled = false
threshold = 2

[directory]
truncation_length = 4
truncate_to_repo = true
format = '[ ](bold blue)[$path]($style)'
style = 'bold cyan'
home_symbol = '~'

[directory.substitutions]

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style) )'

[azure]
format = '[$symbol($subscription )]($style)'
disabled = false
style = 'bold blue'
symbol = "󰠅 "

[golang]
format = '[ ](bold cyan)'

[python]
format = '[ ($version )(\($virtualenv\) )](bold yellow)'

[dotnet]
format = '[ ](bold blue)'

[nodejs]
format = '[ ](bold green)'

[kubernetes]
symbol = '☸ '
disabled = true
detect_files = ['Dockerfile']
format = '[$symbol$context( \($namespace\))]($style) '

[docker_context]
disabled = false

[palettes.vibrant_black]
black = "#0B0F14"
red = "#E11D48"
green = "#16A34A"
yellow = "#D4A72C"
blue = "#3B82F6"
purple = "#8B5CF6"
cyan = "#06B6D4"
white = "#E2E8F0"
bright-black = "#4B5563"
bright-red = "#FB7185"
bright-green = "#22C55E"
bright-yellow = "#FACC15"
bright-blue = "#60A5FA"
bright-purple = "#A78BFA"
bright-cyan = "#22D3EE"
bright-white = "#FFFFFF"
text = "#F8FAFC"
muted = "#94A3B8"
base = "#000000"
